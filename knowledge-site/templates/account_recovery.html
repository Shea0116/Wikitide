{% extends 'base.html' %}{% block title %}恢复账户{% endblock %}{% block content %}<div class="page-head"><h1>使用恢复码重置密码</h1><p>使用在账户设置中保存的恢复码。没有恢复码时，请联系管理员处理。</p></div>{% if success %}<p role="status">密码已重置，全部旧会话和恢复码已失效。</p><a class="button" href="/login">使用新密码登录</a>{% else %}{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form class="stack-form" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>用户名<input name="username" required maxlength="64" autocomplete="username"></label><label>恢复码<input name="code" required maxlength="100" autocomplete="off"></label><label>新密码<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><label>确认新密码<input name="confirm" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><button class="button">重置密码</button></form>{% endif %}{% endblock %}

{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="form-wrap"><p class="eyebrow">账户</p><h1>登录知识库</h1><p class="muted">私人笔记与编辑功能需要授权账户。</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form class="stack-form" action="/login" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <label>用户名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button" type="submit">登录</button>
  </form>
  <p class="muted">还没有账户？<a href="/register?next={{ next|urlencode }}">注册并开始协作</a> · <a href="/recover">使用恢复码找回账户</a></p>
</div>
{% endblock %}

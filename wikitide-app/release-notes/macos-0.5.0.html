<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>WikiTide 0.5.0</title>
<body><h1>WikiTide 0.5.0</h1><ul>
<li>新增独立原生“本机记忆”入口，按站点和账户隔离保存项目、记忆、对话与摘要。</li>
<li>本机内容使用设备钥匙串密钥加密，支持离线显式解锁、编辑、搜索、停用与遗忘。</li>
<li>选择记忆后可预览待发送内容并进行临时云端问答；需要独立原生登录和配套服务端接口。</li>
<li>支持明文 JSON/Markdown 导出与 JSON 导入预览，冲突条目不会自动覆盖。</li>
<li>锁定、切换账户和会话失效时取消生成，原生编辑及生成状态纳入更新重启保护。</li>
</ul><p>本机保存不等于离线生成；云端推理仍需联网，生成服务按其自身规则处理请求。设备密钥丢失且无导出副本时无法恢复。</p></body></html>
